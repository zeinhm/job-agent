<!-- job-boards markup shape of a multi-select question shown as checkboxes: a fieldset with a legend, no id / role on the
     group, one input + label[for] per option (ids are the question id plus an option index). Fake question, fake options. -->
<div class="field-wrapper">
  <fieldset class="checkbox">
    <legend class="label">Do you have experience with the following stack:</legend>
    <div class="checkbox__wrapper">
      <input type="checkbox" id="question_2001_0" value="0" /><label for="question_2001_0"
        >JS</label
      >
    </div>
    <div class="checkbox__wrapper">
      <input type="checkbox" id="question_2001_1" value="1" /><label for="question_2001_1"
        >Vue</label
      >
    </div>
    <div class="checkbox__wrapper">
      <input type="checkbox" id="question_2001_2" value="2" /><label for="question_2001_2"
        >Some of the above</label
      >
    </div>
    <div class="checkbox__wrapper">
      <input type="checkbox" id="question_2001_3" value="3" /><label for="question_2001_3"
        >None of the above</label
      >
    </div>
  </fieldset>
</div>
