<!--
  A Cover Letter file upload with the "Enter manually" option (research t_d0698332, section 2): the file input
  `#cover_letter`, a type=button `[data-testid=cover_letter-text]` and the textarea `#cover_letter_text`, which only
  exists once the button was clicked.
-->
<div class="field-wrapper">
  <div
    role="group"
    aria-labelledby="upload-label-cover_letter"
    class="file-upload"
    data-allow-s3="false"
  >
    <div id="upload-label-cover_letter" class="label upload-label">Cover Letter</div>
    <div class="file-upload__wrapper">
      <button type="button" class="btn btn--pill">Attach</button>
      <button type="button" class="btn btn--pill" data-testid="cover_letter-text">
        Enter manually
      </button>
      <label class="visually-hidden" for="cover_letter">Attach</label>
      <input
        id="cover_letter"
        class="visually-hidden"
        type="file"
        accept=".pdf,.doc,.docx,.txt,.rtf"
      />
    </div>
    <div id="cover_letter-text-area"></div>
  </div>
</div>
<script>
  document.querySelector("[data-testid=cover_letter-text]").addEventListener("click", () => {
    const box = document.getElementById("cover_letter-text-area");
    if (box.firstChild) return;
    box.innerHTML =
      '<label id="cover_letter_text-label" for="cover_letter_text" class="label">Cover Letter</label>' +
      '<textarea id="cover_letter_text" class="input input__multi-line" maxlength="5000"></textarea>';
  });
</script>
