<script>
  // A page that uploads the file on attach and, 800 ms later when the upload completes, replaces the file input with a
  // fresh empty one and shows the file name in an upload-complete line (the input itself no longer holds the file).
  document.addEventListener(
    "change",
    (event) => {
      const input = event.target;
      if (input.id !== "resume" || !input.files[0]) return;
      const name = input.files[0].name;
      setTimeout(() => {
        const fresh = document.createElement("input");
        for (const a of input.attributes) fresh.setAttribute(a.name, a.value);
        input.replaceWith(fresh);
        if (fresh.closest(".file-upload__wrapper").querySelector(".file-upload__filename")) return;
        const line = document.createElement("div");
        line.className = "file-upload__filename";
        line.textContent = name;
        fresh.closest(".file-upload__wrapper").appendChild(line);
      }, 800);
    },
    true,
  );
</script>
