<!--
  A Cover Letter block that offers both controls at once: the attach input `#cover_letter` and a paste-text textarea that is
  already on the page (no "Enter manually" button) under an id of its own, labelled "Cover Letter".
-->
<div class="field-wrapper">
  <div
    role="group"
    aria-labelledby="upload-label-cover_letter"
    class="file-upload"
    data-allow-s3="false"
  >
    <div id="upload-label-cover_letter" class="label upload-label">Cover Letter</div>
    <div class="file-upload__wrapper">
      <button type="button" class="btn btn--pill">Attach</button>
      <label class="visually-hidden" for="cover_letter">Attach</label>
      <input
        id="cover_letter"
        class="visually-hidden"
        type="file"
        accept=".pdf,.doc,.docx,.txt,.rtf"
      />
    </div>
    <div class="text-input-wrapper">
      <label id="cover_letter_paste-label" for="cover_letter_paste" class="label"
        >Cover Letter</label
      >
      <textarea id="cover_letter_paste" class="input input__multi-line" maxlength="5000"></textarea>
    </div>
  </div>
</div>
