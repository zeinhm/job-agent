<script>
  // A page that removes the file input on attach and shows the file as a chip: the name with its dashes turned into spaces
  // and no extension, next to a size line, with a remove button. No "filename" class, no whole name token in the text.
  document.addEventListener(
    "change",
    (event) => {
      const input = event.target;
      if (input.id !== "resume" || !input.files[0]) return;
      const name = input.files[0].name;
      const wrapper = input.closest(".file-upload__wrapper");
      setTimeout(() => {
        input.remove();
        const chip = document.createElement("div");
        chip.className = "attachment-chip";
        chip.innerHTML = "<span></span><small>12 KB</small><button type='button'>Remove</button>";
        chip.querySelector("span").textContent = name.replace(/\.[a-z]+$/i, "").replace(/-/g, " ");
        wrapper.appendChild(chip);
      }, 300);
    },
    true,
  );
</script>
