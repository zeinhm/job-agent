<!-- a Cover Letter question stored as a textarea (API type textarea): a plain text field -->
<div class="field-wrapper">
  <div class="text-input-wrapper">
    <div class="input-wrapper">
      <label id="cover_letter-label" for="cover_letter" class="label">Cover Letter</label>
      <textarea
        id="cover_letter"
        class="input input__multi-line"
        aria-required="false"
        maxlength="5000"
      ></textarea>
    </div>
  </div>
</div>
