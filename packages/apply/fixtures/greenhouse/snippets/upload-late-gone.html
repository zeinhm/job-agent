<script>
  // A page that keeps the attach but completes the upload slowly: 5.5 s after the attach it removes the file input
  // altogether and shows the file name in an upload-complete line (no input is left to attach to again).
  document.addEventListener(
    "change",
    (event) => {
      const input = event.target;
      if (input.id !== "resume" || !input.files[0]) return;
      const name = input.files[0].name;
      const wrapper = input.closest(".file-upload__wrapper");
      setTimeout(() => {
        input.remove();
        const line = document.createElement("div");
        line.className = "file-upload__filename";
        line.textContent = name;
        wrapper.appendChild(line);
      }, 5500);
    },
    true,
  );
</script>
