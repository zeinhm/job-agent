# job-agent automation settings (sourced by bin/lib.sh)
MAX_PARALLEL=${MAX_PARALLEL:-3}            # local Claude Code runs at the same time (cloud runs don't count)
INTERVAL=${INTERVAL:-60}               # dispatcher pass, seconds
CLOUD_UNTIL=${CLOUD_UNTIL:-2026-11-05}    # cloud credit expiry; from this date the Dev runs on Pro
CLOUD_TIMEOUT_MIN=${CLOUD_TIMEOUT_MIN:-180}     # one cloud attempt may take this long before the next attempt starts
CLOUD_MAX_TRIES=${CLOUD_MAX_TRIES:-3}         # cloud attempts per task, then the Doctor takes over
LOCAL_MAX_TRIES=${LOCAL_MAX_TRIES:-2}         # local runs that end without a result, then the Doctor takes over
MAX_FAILS=${MAX_FAILS:-3}               # QA/audit FAILs per task, then the Doctor takes over
BATCH_MEDIUM=${BATCH_MEDIUM:-5}            # merged medium-risk tasks that trigger a batch audit
BATCH_LOW=${BATCH_LOW:-10}              # merged low-risk tasks that trigger a batch audit
# models (Claude Code aliases); the Dev runs in the cloud while the credit lasts
MODEL_dev=${MODEL_dev:-sonnet}
MODEL_qa=${MODEL_qa:-sonnet}
MODEL_auditor=${MODEL_auditor:-sonnet}
MODEL_researcher=${MODEL_researcher:-sonnet}
MODEL_pm=${MODEL_pm:-opus}
